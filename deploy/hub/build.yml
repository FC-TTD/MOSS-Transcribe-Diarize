- name: Build one immutable provider artifact on the existing Nest builder
  hosts: localhost
  gather_facts: false
  vars:
    ci_project_name: "{{ provider_project }}"
    ci_image_name: "{{ component }}"
    ci_project_path: "{{ source_path }}"
    ci_dockerfile_path: "{{ source_path }}/deploy/hub/Dockerfile.{{ component }}"
    ci_compose_file_path: "{{ evidence_path }}/compose-{{ component }}.yaml"
    ci_build_host: ttd-nest
    ci_buildkit_host: ttd-nest
    ci_buildkit_endpoint: tcp://ttd-nest:1234
    ci_buildx_builder_name: hub-immutable-builder
    ci_publish_label_tag: false
    ci_registry_cache_ref: "registry.ttd/music-native/shared-cache:buildcache"
    ci_probe_work_dir: "{{ evidence_path }}/probe-{{ component }}"
    ci_build_log_path: "{{ evidence_path }}/build-{{ component }}.log"
  tasks:
    - ansible.builtin.assert:
        that:
          - component in provider_components
          - source_path != ''
          - evidence_path != ''
    # The shared role derives Compose metadata; keep that generated output outside
    # the immutable source archive. Production Compose is promoted separately.
    - ansible.builtin.copy:
        dest: "{{ ci_compose_file_path }}"
        content: "services:\n  {{ component }}:\n    image: registry.ttd/{{ provider_project }}/{{ component }}:prepared\n"
    - ansible.builtin.include_role:
        name: docker_ci_cd
        tasks_from: docker_ci.yml
    - ansible.builtin.copy:
        dest: "{{ evidence_path }}/image-{{ component }}.json"
        content: "{{ {'image':ci_hash_image_name,'contentHash':ci_content_hash,'source':source_path} | to_nice_json }}"
